name: Terraform Infrastructure

on:
  push:
    branches: [dev, main]
    paths:
      - "terraform/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to target"
        required: true
        type: choice
        options: [dev, prod]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write   # OIDC federation to AWS - no long-lived AWS keys stored in GitHub
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  TF_WORKING_DIR: terraform/environments

jobs:
  # Security scanning runs as its own workflow (security-scan.yml, triggered
  # independently on every PR/push) rather than being called from here - it
  # used to be called as a reusable workflow too, which made it run twice
  # per terraform-touching PR. The gate now lives in branch protection
  # (required status checks on dev/main) instead of an in-pipeline `needs`.
  #
  # Branch -> environment mapping: "prod" is intentionally not the name of
  # a branch. main is the long-lived branch (dev -> main promotion, same as
  # the rest of the repo's git flow); "prod" is just what that environment
  # is called (workspace name, tfvars file, tags). See locals.git_branch in
  # the Terraform config for the other half of this mapping (ArgoCD's
  # targetRevision needs the actual branch name, not the environment name).
  determine-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENVIRONMENT="${{ inputs.environment }}"
          else
            # github.ref_name resolves to "<pr_number>/merge" on pull_request
            # events, never the actual branch name - github.base_ref is the
            # field that holds the PR's target branch. Everywhere else
            # (push), ref_name is the real branch name.
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              REF="${{ github.base_ref }}"
            else
              REF="${{ github.ref_name }}"
            fi

            if [ "$REF" == "main" ]; then
              ENVIRONMENT="prod"
            else
              ENVIRONMENT="dev"
            fi
          fi
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

  # Fails fast with a clear message if the resolved environment has no
  # matching tfvars file, instead of a confusing error partway through
  # `terraform plan`/`apply`, or worse, "Select/Create Workspace" silently
  # creating a new empty workspace that has no tfvars backing it at all.
  validate-env:
    needs: determine-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tfvars file exists for this environment
        run: |
          FILE="${{ env.TF_WORKING_DIR }}/tfvars/${{ needs.determine-env.outputs.environment }}.tfvars"
          if [ ! -f "$FILE" ]; then
            echo "::error::No tfvars file for environment '${{ needs.determine-env.outputs.environment }}' (expected $FILE)"
            exit 1
          fi
          echo "Found $FILE"

  plan:
    needs: [determine-env, validate-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.environment }}-plan
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      # Vault token is the bootstrap/root token from the one-time
      # `vault operator init` - stored as a GitHub secret, never in tfvars.
      # See README "Vault bootstrap".
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      TF_VAR_configure_vault: ${{ vars.CONFIGURE_VAULT || 'false' }}
      TF_VAR_github_token: ${{ secrets.GITOPS_GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Select/Create Workspace
        run: |
          terraform workspace select ${{ needs.determine-env.outputs.environment }} \
          || terraform workspace new ${{ needs.determine-env.outputs.environment }}

      - name: Verify workspace matches expected environment
        run: |
          CURRENT=$(terraform workspace show)
          EXPECTED="${{ needs.determine-env.outputs.environment }}"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "::error::Selected workspace '$CURRENT' does not match expected environment '$EXPECTED'"
            exit 1
          fi

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="tfvars/${{ needs.determine-env.outputs.environment }}.tfvars" \
            -out=tfplan \
            -no-color | tee plan_output.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8').slice(0, 60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan (${{ needs.determine-env.outputs.environment }})\n\`\`\`\n${plan}\n\`\`\``
            });

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.determine-env.outputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan

  apply:
    needs: [determine-env, validate-env, plan]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    # The "prod" GitHub Environment has a required-reviewer rule attached
    # (repo Settings > Environments) - "dev" doesn't, so dev applies run
    # straight through once dispatched, prod applies wait for approval.
    environment: ${{ needs.determine-env.outputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      TF_VAR_configure_vault: ${{ vars.CONFIGURE_VAULT || 'false' }}
      TF_VAR_github_token: ${{ secrets.GITOPS_GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Select Workspace
        run: terraform workspace select ${{ needs.determine-env.outputs.environment }}

      - name: Verify workspace matches expected environment
        run: |
          CURRENT=$(terraform workspace show)
          EXPECTED="${{ needs.determine-env.outputs.environment }}"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "::error::Selected workspace '$CURRENT' does not match expected environment '$EXPECTED'"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.determine-env.outputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  destroy:
    needs: [determine-env, validate-env]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.environment }}-destroy
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      # Needed so the vault provider can authenticate to tear down the
      # vault_kv_secret_v2 / auth backend / policy resources cleanly.
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      TF_VAR_configure_vault: ${{ vars.CONFIGURE_VAULT || 'false' }}
      TF_VAR_github_token: ${{ secrets.GITOPS_GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - run: terraform init
      - run: terraform workspace select ${{ needs.determine-env.outputs.environment }}

      - name: Verify workspace matches expected environment
        run: |
          CURRENT=$(terraform workspace show)
          EXPECTED="${{ needs.determine-env.outputs.environment }}"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "::error::Selected workspace '$CURRENT' does not match expected environment '$EXPECTED'"
            exit 1
          fi

      - run: |
          terraform destroy -auto-approve \
            -var-file="tfvars/${{ needs.determine-env.outputs.environment }}.tfvars"

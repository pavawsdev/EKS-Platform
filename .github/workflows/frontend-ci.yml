name: Frontend CI/CD

on:
  push:
    branches: [dev, test]
    paths:
      - "apps/frontend/**"
  pull_request:
    paths:
      - "apps/frontend/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write
  security-events: write

env:
  ECR_REPOSITORY: eksplat-frontend
  AWS_REGION: ap-south-1
  WORKING_DIR: apps/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      # npm ci deliberately not used here: react-scripts (Create React
      # App) is unmaintained and its transitive dependency tree no longer
      # resolves consistently enough for npm ci's strict lockfile check
      # against a current npm registry. npm install is lenient about that
      # version drift and just works - acceptable tradeoff for this app.
      - run: npm install
      - run: npm run lint --if-present
      - run: npm test -- --watchAll=false --passWithNoTests
      - run: npm run build

  build-and-push:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} \
                       -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest .

      # Scanning image-ref directly here made Trivy find the freshly-built
      # tag in the local Docker daemon and scan it through the docker
      # socket, which crashed reliably (silent death mid-scan, no output)
      # - confirmed by a diagnostic job that scanned the same base images
      # successfully via Trivy's remote-registry client instead. Exporting
      # to a tar archive and scanning that sidesteps the daemon-socket
      # path entirely.
      - name: Save image to tarball
        run: |
          docker save ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} \
            -o trivy-image-input.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ env.WORKING_DIR }}/trivy-image-input.tar
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          version: v0.72.0
          vuln-type: os,library
          output: ${{ env.WORKING_DIR }}/trivy-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-frontend
          path: ${{ env.WORKING_DIR }}/trivy-report.txt

      - name: Push image (only after scan passes)
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  update-manifest:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # persist-credentials: false - otherwise checkout leaves a git
      # credential header authenticated as the built-in GITHUB_TOKEN
      # (contents: read only, per this job's permissions above), which
      # takes precedence over the GitOps PAT embedded in the remote URL
      # below and makes `git push` fail with 403 instead of using the PAT.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment
        id: env
        run: |
          ENV=dev
          if [ "${{ github.ref_name }}" == "test" ]; then ENV=test; fi
          echo "name=$ENV" >> "$GITHUB_OUTPUT"

      - name: Fetch GitOps push token from AWS Secrets Manager
        id: gh-token
        run: |
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id eksplat-${{ steps.env.outputs.name }}-github-token \
            --query SecretString --output text)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Bump image tag in Helm values (GitOps trigger for ArgoCD)
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ needs.build-and-push.outputs.image_tag }}\"/" helm/frontend/values-${{ steps.env.outputs.name }}.yaml

      - name: Commit updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ steps.gh-token.outputs.token }}@github.com/${{ github.repository }}.git"
          git add helm/frontend/values-*.yaml
          git commit -m "ci: bump frontend image to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]" || echo "no changes"
          git push

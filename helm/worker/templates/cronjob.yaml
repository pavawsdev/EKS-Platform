{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "worker.fullname" . }}-heartbeat
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "worker.selectorLabels" . | nindent 12 }}
          {{- if .Values.vault.enabled }}
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
            vault.hashicorp.com/agent-inject-secret-db: {{ .Values.vault.dbSecretPath | quote }}
            vault.hashicorp.com/agent-inject-template-db: |
              {{`{{- with secret "`}}{{ .Values.vault.dbSecretPath }}{{`" -}}
              export DB_HOST="{{ .Data.data.host }}"
              export DB_PORT="{{ .Data.data.port }}"
              export DB_USER="{{ .Data.data.username }}"
              export DB_PASSWORD="{{ .Data.data.password }}"
              {{- end }}`}}
            # Without this, the Vault sidecar never exits and the Job
            # hangs "Running" forever instead of reaching "Complete" -
            # this annotation makes the agent render the secret once and
            # exit, rather than staying alive to keep it fresh.
            vault.hashicorp.com/agent-pre-populate-only: "true"
          {{- end }}
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: heartbeat
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              {{- if .Values.vault.enabled }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  until [ -f /vault/secrets/db ]; do echo "waiting for vault agent to render secrets"; sleep 2; done
                  . /vault/secrets/db
                  exec node cron.js
              {{- end }}
              env:
                {{- range $key, $value := .Values.env }}
                - name: {{ $key }}
                  value: "{{ $value }}"
                {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}

name: Backend CI/CD

on:
  push:
    branches: [dev, test]
    paths:
      - "apps/backend/**"
  pull_request:
    paths:
      - "apps/backend/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write
  security-events: write

env:
  ECR_REPOSITORY: eksplat-backend
  AWS_REGION: ap-south-1
  WORKING_DIR: apps/backend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test -- --passWithNoTests

  build-and-push:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} \
                       -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest .

      # Scanning image-ref directly here made Trivy find the freshly-built
      # tag in the local Docker daemon and scan it through the docker
      # socket, which crashed reliably (silent death mid-scan, no output)
      # - confirmed by a diagnostic job that scanned the same base images
      # successfully via Trivy's remote-registry client instead. Exporting
      # to a tar archive and scanning that sidesteps the daemon-socket
      # path entirely.
      - name: Save image to tarball
        run: |
          docker save ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} \
            -o trivy-image-input.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ env.WORKING_DIR }}/trivy-image-input.tar
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          version: v0.72.0
          vuln-type: os,library
          output: ${{ env.WORKING_DIR }}/trivy-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-backend
          path: ${{ env.WORKING_DIR }}/trivy-report.txt

      - name: Push image (only after scan passes)
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  update-manifest:
    needs: build-and-push
    # workflow_dispatch too, not just push - lets this GitOps step be
    # re-run manually to recover from a failed/rejected push (e.g. a
    # concurrent-push race with another workflow) without needing to
    # contrive a new commit just to retrigger it. Fine for dev's fast/
    # ungated iteration model - if this pipeline is ever wired to main/
    # prod, add an Environment-based approval gate first (same treatment
    # as terraform.yml's prod apply/destroy), since this would otherwise
    # let anyone who can dispatch the workflow deploy prod with no review.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Shared with frontend-ci.yml's update-manifest job on purpose: a
    # single commit touching both apps/frontend/** and apps/backend/**
    # triggers both workflows at once, and both jobs' GitOps push target
    # the same branch. Same group name stops the two jobs' git commands
    # from running interleaved/simultaneously - paired with the explicit
    # checkout ref below, which stops the second job (once it's their
    # turn) from working off a stale pre-queue snapshot.
    concurrency:
      group: gitops-manifest-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      # ref: explicit branch name, not the default (github.sha, resolved
      # once at dispatch time). Without this, a job that waits behind the
      # concurrency group above still checks out a stale snapshot from
      # before it was queued - the wait alone prevents the two jobs' git
      # commands from interleaving, but not this staleness, so the second
      # job's push was still rejected as non-fast-forward even though it
      # ran strictly after the first one finished (confirmed via job
      # timestamps: zero overlap, yet still rejected). ref: <branch name>
      # re-resolves to the branch's actual current tip at checkout time,
      # not a value cached back when the workflow was originally
      # dispatched.
      #
      # persist-credentials: false - otherwise checkout leaves a git
      # credential header authenticated as the built-in GITHUB_TOKEN
      # (contents: read only, per this job's permissions above), which
      # takes precedence over the GitOps PAT embedded in the remote URL
      # below and makes `git push` fail with 403 instead of using the PAT.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment
        id: env
        run: |
          ENV=dev
          if [ "${{ github.ref_name }}" == "test" ]; then ENV=test; fi
          echo "name=$ENV" >> "$GITHUB_OUTPUT"

      - name: Fetch GitOps push token from AWS Secrets Manager
        id: gh-token
        run: |
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id eksplat-${{ steps.env.outputs.name }}-github-token \
            --query SecretString --output text)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Bump image tag in Helm values (GitOps trigger for ArgoCD)
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ needs.build-and-push.outputs.image_tag }}\"/" helm/backend/values-${{ steps.env.outputs.name }}.yaml
          # helm/worker shares the same image/ECR repo as backend (only the
          # container command differs) - without this, worker/cron would
          # keep running a stale image after every backend push.
          sed -i "s/^  tag: .*/  tag: \"${{ needs.build-and-push.outputs.image_tag }}\"/" helm/worker/values-${{ steps.env.outputs.name }}.yaml

      - name: Commit updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ steps.gh-token.outputs.token }}@github.com/${{ github.repository }}.git"
          git add helm/backend/values-*.yaml helm/worker/values-*.yaml
          git commit -m "ci: bump backend image to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]" || echo "no changes"
          git push

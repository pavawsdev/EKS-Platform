name: Security Scans

on:
  workflow_call:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read
  security-events: write

jobs:
  # Detects which parts of the repo changed so the terraform/helm-specific
  # scanners below can skip their actual scan steps on PRs/pushes that don't
  # touch that area (e.g. a pure frontend change) instead of re-scanning the
  # whole repo every time. gitleaks/codeql/dependency-scan stay unconditional
  # since they're not terraform/k8s-specific. See the per-job comment on
  # tfsec for why the gating is step-level, not job-level.
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      # paths-filter needs a real git history to diff against on `push`
      # events (it only skips this and uses the GitHub API instead on
      # `pull_request`) - without this checkout it fails with "not a git
      # repository", which then cascades: tfsec/checkov/kube-linter all
      # `needs: changes`, and a failed dependency skips them by default,
      # reproducing the exact "skipped required check never satisfies
      # branch protection" problem this workflow was fixed to avoid.
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
            helm:
              - 'helm/**'

  # ---- Secret scanning ----
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks - scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Terraform static analysis ----
  # needs.changes.outputs.terraform gates the individual scan/upload steps
  # below, not the job itself - a job skipped at the job level (via job-
  # level `if:`) reports conclusion "skipped", and GitHub's required-status-
  # checks branch protection treats skipped != success, so the job would
  # never satisfy the check and PRs that don't touch terraform/ would block
  # forever. Skipping the steps instead leaves the job itself completing
  # with "success" (0 steps ran, none failed).
  tfsec:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.terraform == 'true'
      - name: tfsec - Terraform security scan
        if: needs.changes.outputs.terraform == 'true'
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          working_directory: terraform
          sarif_file: tfsec.sarif
      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: needs.changes.outputs.terraform == 'true' && always()
        with:
          sarif_file: tfsec.sarif

  checkov:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.terraform == 'true'
      - name: Checkov - IaC misconfiguration scan
        if: needs.changes.outputs.terraform == 'true'
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          # Several checks depend on values that only exist in dev.tfvars
          # (environment_config has no default) - without this, checkov
          # can't resolve them and falls back to conservative module
          # defaults, producing false positives (e.g. the EKS public
          # endpoint CIDR check).
          var_file: terraform/environments/tfvars/dev.tfvars
          # These 5 checks are intentionally, permanently skipped repo-wide
          # (each also has an inline #checkov:skip with the full reasoning
          # at its resource - some of these run as graph-based checks in
          # this checkov version and don't honor inline comments, hence
          # doing it here too):
          #   CKV_AWS_260 - the ALB is a public web app; port 80 exists to
          #     redirect to HTTPS, open-to-internet is the intended design
          #   CKV2_AWS_5  - the ALB SG is attached by the in-cluster AWS
          #     Load Balancer Controller, outside Terraform's static graph
          #   CKV_AWS_355 - every remaining "*" Resource is an AWS list/
          #     describe action with no resource-level permissions support
          #   CKV2_AWS_57 - no GitHub API exists to rotate a PAT in place
          #   CKV_AWS_39  - EKS public endpoint must stay reachable (CIDR-
          #     restricted) since GitHub-hosted runners aren't in the VPC
          #   CKV_AWS_51  - ECR tags must stay mutable so CI can re-push a
          #     floating :latest tag alongside each commit-sha tag
          skip_check: CKV_AWS_260,CKV2_AWS_5,CKV_AWS_355,CKV2_AWS_57,CKV_AWS_39,CKV_AWS_51
          soft_fail: false
      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: needs.changes.outputs.terraform == 'true' && always()
        with:
          sarif_file: checkov.sarif

  # ---- Application source code SAST ----
  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ["javascript"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # ---- Dependency vulnerability scanning ----
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm audit - frontend
        working-directory: apps/frontend
        run: npm audit --audit-level=high || true
      - name: npm audit - backend
        working-directory: apps/backend
        run: npm audit --audit-level=high || true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          # see frontend-ci.yml/backend-ci.yml for why this is pinned
          version: v0.72.0
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  # ---- Kubernetes / Helm manifest scanning ----
  kube-linter:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.helm == 'true'
      - name: KubeLinter - Helm chart best practices
        if: needs.changes.outputs.helm == 'true'
        uses: stackrox/kube-linter-action@v1
        with:
          directory: helm

environment: dev
replicaCount: 1
autoscaling:
  enabled: false
image:
  tag: "9feebfda"
serviceAccount:
  irsaRoleArn: "arn:aws:iam::887047732645:role/eksplat-dev-backend-irsa"
env:
  AWS_REGION: "ap-south-1"
  SQS_QUEUE_URL: "https://sqs.ap-south-1.amazonaws.com/887047732645/eksplat-dev-jobs"
vault:
  enabled: true
  role: "backend-dev"
  addr: "https://vault.dev.example.internal"
  run: "node index.js"
  secrets:
    - name: db
      path: "secret/data/dev/db"
      body: |
        {{- with secret "secret/data/dev/db" -}}
        export DB_HOST="{{ .Data.data.host }}"
        export DB_PORT="{{ .Data.data.port }}"
        export DB_USER="{{ .Data.data.username }}"
        export DB_PASSWORD="{{ .Data.data.password }}"
        {{- end }}
ingress:
  enabled: true
  host: "backend.dev.example.internal"
tags:
  environment: dev

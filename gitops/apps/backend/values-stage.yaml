environment: stage
replicaCount: 2
autoscaling:
  minReplicas: 2
  maxReplicas: 4
image:
  tag: "initial"
vault:
  enabled: true
  role: "backend-stage"
  addr: "https://vault.stage.example.internal"
  run: "node index.js"
  secrets:
    - name: db
      path: "secret/data/stage/db"
      body: |
        {{- with secret "secret/data/stage/db" -}}
        export DB_HOST="{{ .Data.data.host }}"
        export DB_PORT="{{ .Data.data.port }}"
        export DB_USER="{{ .Data.data.username }}"
        export DB_PASSWORD="{{ .Data.data.password }}"
        {{- end }}
tags:
  environment: stage

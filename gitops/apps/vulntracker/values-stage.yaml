environment: stage
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
image:
  tag: "initial"
env:
  PUBLIC_BASE_URL: "https://vulntracker.stage.example.internal"
vault:
  enabled: true
  role: "vulntracker-stage"
  addr: "https://vault.stage.example.internal"
  run: "uvicorn main:app --host 0.0.0.0 --port 8000"
  secrets:
    - name: db
      path: "secret/data/stage/vulntracker"
      body: |
        {{- with secret "secret/data/stage/vulntracker" -}}
        export DATABASE_URL="postgresql://{{ .Data.data.username }}:{{ .Data.data.password }}@{{ .Data.data.host }}:{{ .Data.data.port }}/{{ .Data.data.dbname }}"
        {{- end }}
    - name: jwt
      path: "secret/data/stage/vulntracker"
      consumeAs: "env:JWT_SECRET_KEY_FILE"
      body: |
        {{- with secret "secret/data/stage/vulntracker" -}}{{ .Data.data.jwt_secret_key }}{{- end }}
ingress:
  enabled: true
  host: "vulntracker.stage.example.internal"
networkPolicy:
  ingress:
    - from:
        - ipBlock:
            cidr: "10.15.0.0/16"
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vulntracker-notify
      ports:
        - port: 3001
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - port: 8200
          protocol: TCP
    - to:
        - ipBlock:
            cidr: "10.15.0.0/16"
      ports:
        - port: 5432
          protocol: TCP
tags:
  environment: stage

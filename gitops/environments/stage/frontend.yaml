apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-stage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: eksplat
  source:
    repoURL: https://github.com/pavawsdev/EKS-Platform.git
    targetRevision: main
    path: gitops/charts/application
    helm:
      valueFiles:
        - /gitops/apps/frontend/values.yaml
        - /gitops/apps/frontend/values-stage.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

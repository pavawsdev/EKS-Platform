{{- if .Values.keda.enabled }}
# provider: aws-eks resolves identity from the KEDA operator's own IRSA
# role (wired in terraform/modules/add-ons - the operator polls SQS
# queue depth to decide replica count, separate from the worker
# Deployment's own IRSA role which only consumes/deletes messages).
# Verify against the installed KEDA version post-apply
# (kubectl logs -n keda deploy/keda-operator) - some versions resolve
# identity from the target workload's SA instead of the operator's.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  podIdentity:
    provider: aws-eks
{{- end }}
